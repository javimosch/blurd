# blurd — compose profiles for the distributed path.
#
# ⚠  THIS FILE IS FOR LOCAL DEVELOPMENT. Every credential in it
#    (`blurd-dev-secret`, `change-me`) is a well-known placeholder, published in
#    a public repository, and must never reach an environment you care about.
#    For a real deployment see docs/deployment.md, which takes its secrets from
#    the environment or a Kubernetes Secret.
#
#   docker compose up -d                      blurd + MinIO
#   docker compose --profile pg up -d         + Postgres
#   docker compose --profile mongo up -d      + MongoDB
#   docker compose --profile scale up -d      + nginx, 3 replicas
#
# The default is blobs in object storage, metadata in SQLite. All three
# metadata backends are supported and pass the same 113 conformance checks;
# `pg` and `mongo` are the two that several replicas can share.
#
# Several replicas, on either shared backend:
#   BLURD_DB_BACKEND=postgres \
#   BLURD_DB_DSN=postgresql://blurd:blurd-dev-secret@postgres:5432/blurd \
#   docker compose --profile pg --profile scale up -d --scale blurd=3
#
#   BLURD_DB_BACKEND=mongo \
#   BLURD_DB_DSN=mongodb://blurd:blurd-dev-secret@mongo:27017/?authSource=admin \
#   docker compose --profile mongo --profile scale up -d --scale blurd=3
#
# On sqlite, `scale` deliberately fails: a second replica against one SQLite
# home refuses to start, because SQLite is a single-writer file and sharing it
# is silent corruption. Point BLURD_DB_BACKEND at Postgres or Mongo and the
# guard lifts on its own -- replicas then share metadata and blobs, and each
# processes what it accepts.
services:

  minio:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: blurd
      MINIO_ROOT_PASSWORD: blurd-dev-secret
    ports: ["9000:9000"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO has no "create this bucket on boot" flag; one shot with the client.
  createbucket:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 blurd blurd-dev-secret &&
      mc mb --ignore-existing local/blurd &&
      echo bucket ready"

  blurd:
    build:
      context: .
      args:
        # Both drivers are optional dependencies. They are built in here because
        # one image should be able to run any backend the compose file offers;
        # a deployment that has picked one can drop the other and save the
        # layer.
        WITH_POSTGRES: ${WITH_POSTGRES:-1}
        WITH_MONGO: ${WITH_MONGO:-1}
    image: blurd:0.19.0
    # A draining replica reports 503, so compose/k8s takes it out of rotation
    # before it stops accepting.
    stop_grace_period: 40s
    depends_on:
      minio: {condition: service_healthy}
    environment:
      BLURD_STORAGE_BACKEND: s3
      BLURD_S3_ENDPOINT: http://minio:9000
      BLURD_S3_BUCKET: blurd
      BLURD_S3_ACCESS_KEY: blurd
      BLURD_S3_SECRET_KEY: blurd-dev-secret
      # Models are not baked into the image (licence, and rebuild-as-
      # redistribution). With replicas, prefer an init container writing to a
      # shared volume overeach replica fetching at boot.
      BLURD_PULL_MODELS: "1"
      BLURD_DASHBOARD_PASSWORD: change-me
      # sqlite by default; see the header for the postgres and mongo forms.
      BLURD_DB_BACKEND: ${BLURD_DB_BACKEND:-sqlite}
      BLURD_DB_DSN: ${BLURD_DB_DSN:-}
      BLURD_DB_DATABASE: ${BLURD_DB_DATABASE:-blurd}
      BLURD_DRAIN_SECONDS: ${BLURD_DRAIN_SECONDS:-20}
    # A RANGE, not a fixed port: `--scale blurd=3` cannot bind 8770 three times
    # on the host. The first replica still lands on 8770 for the single-replica
    # case; under `scale` the load balancer is the front door on 8780.
    ports: ["8770-8779:8770"]
    # Only metadata lives here now: ~19 GB per million images, against ~360 GB
    # when blobs were local.
    volumes: ["blurd-home:/var/lib/blurd"]

  # --- the shared metadata store ---------------------------------------------
  #
  # `--profile pg` starts Postgres. Point blurd at it with:
  #   BLURD_DB_BACKEND=postgres
  #   BLURD_DB_DSN=postgresql://blurd:blurd-dev-secret@postgres:5432/blurd
  # The image must carry psycopg for that (optional dependency, see
  # requirements.txt). Several replicas are still gated on step 2 of
  # spec/distributed.md -- leases, a migration lock and pooling.

  postgres:
    profiles: ["pg"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blurd
      POSTGRES_PASSWORD: blurd-dev-secret
      POSTGRES_DB: blurd
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blurd"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    profiles: ["mongo"]
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: blurd
      MONGO_INITDB_ROOT_PASSWORD: blurd-dev-secret
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- the target topology ----------------------------------------------------

  lb:
    profiles: ["scale"]
    image: nginx:alpine
    depends_on: [blurd]
    ports: ["8780:8770"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]

volumes:
  minio-data:
  blurd-home:
  pg-data:
  mongo-data:
