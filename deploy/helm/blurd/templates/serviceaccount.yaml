{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "blurd.serviceAccountName" . }}
  labels:
    {{- include "blurd.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# blurd calls no Kubernetes API. The token is mounted only because some
# clusters' object-storage identity (IRSA, Workload Identity) rides on the
# ServiceAccount.
automountServiceAccountToken: false
{{- end }}
