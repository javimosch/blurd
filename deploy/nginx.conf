# Load balancer for the `scale` profile.
#
# Nothing clever: blurd replicas are interchangeable for reads, and a submission
# only needs the replica that accepted it to stay alive for the few hundred
# milliseconds it takes. No session affinity is required -- upload payloads are
# held in the accepting replica's memory (source images are never written to
# disk), so a request is sticky for its own lifetime and nothing longer.
events { worker_connections 1024; }
http {
  # Docker's DNS returns one A record per replica, but `upstream { server x; }`
  # resolves ONCE at startup -- so nginx can pin to a replica that later dies
  # and keep sending traffic to it. Re-resolving per request through the
  # embedded resolver is what makes `--scale` actually work.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8770;
    client_max_body_size 64m;          # matches MAX_BODY in src/server.py

    location / {
      set $blurd_upstream blurd;
      proxy_pass http://$blurd_upstream:8770;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # A job can be long-polled with ?wait=120; do not cut it short.
      proxy_read_timeout 180s;
    }

    # Redacted blobs are immutable for a given (sha, profile) and already carry
    # an ETag. This is where a real deployment would put a cache -- blurd's read
    # ceiling is ~1200/s, a cache in front makes that number stop mattering.
    location /v1/blobs/ {
      set $blurd_upstream blurd;
      proxy_pass http://$blurd_upstream:8770;
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }
  }
}
