openapi: 3.0.3
info:
  title: blurd
  version: "0.23.4"
  description: >
    Machine-to-machine image redaction. Submit an image by URL or as raw bytes;
    blurd detects faces and licence plates, redacts them, stores only the
    redacted result, and links it to the sha256 of the source.
    This document is the contract every blurd implementation must satisfy.
servers:
  - url: http://127.0.0.1:8770
security:
  - bearerAuth: []
# A key may be SCOPED (see spec/scoped-keys.md). A scope restricts every read
# and stamps every write, and it defines a tenant that namespaces unique codes
# and owns labels. Out-of-scope reads return 404 rather than 403, so a scoped
# caller cannot probe for what exists on the instance.
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    ImageFeedback:
      type: object
      properties:
        id: { type: string, example: fb_3f9a0c1d2e4b5a69 }
        source_sha: { type: string }
        profile_hash: { type: string }
        kind: { type: string, enum: [missed, false_positive, bad_box, ok, other] }
        comment: { type: string }
        box: { type: array, items: { type: integer }, nullable: true }
        author: { type: string, description: "key:<name>, dashboard, or cli" }
        status: { type: string, enum: [open, resolved] }
        resolution: { type: string, nullable: true }
        created_at: { type: string }
        resolved_at: { type: string, nullable: true }
        links: { type: object, properties: { image: { type: string }, blob: { type: string } } }
    Error:
      type: object
      properties:
        ok: { type: boolean, enum: [false] }
        error:
          type: object
          properties:
            code: { type: integer, description: "Semantic exit code, mirrored by the CLI" }
            type: { type: string }
            message: { type: string }
            details: { type: object }
            recoverable: { type: boolean }
            retry_after: { type: integer, nullable: true }
            suggestions: { type: array, items: { type: string } }
    Job:
      type: object
      description: >
        What a producer gets back from POST /v1/images. Created immediately;
        `result` is populated once status is "done".
      properties:
        job_id: { type: string, description: "job_<16 hex>" }
        status: { type: string, enum: [queued, running, done, failed] }
        external_id: { type: string, nullable: true, description: "the producer's own unique code" }
        source_sha: { type: string, nullable: true, description: "known only once processed" }
        profile_hash: { type: string }
        source_kind: { type: string, enum: [url, stream, code-hit] }
        source_ref: { type: string, nullable: true, description: "the submitted URL for url jobs; null for uploads" }
        cached: { type: boolean, description: "true when nothing was reprocessed" }
        attempts: { type: integer }
        created_at: { type: string }
        started_at: { type: string, nullable: true }
        finished_at: { type: string, nullable: true }
        duration_ms: { type: number, nullable: true }
        error: { type: object, nullable: true, description: "same shape as Error.error" }
        result: { $ref: '#/components/schemas/Artifact' }
        blob_url: { type: string }
        blob_url_by_code: { type: string }
    Artifact:
      type: object
      properties:
        source_sha: { type: string, description: "sha256 of the source bytes" }
        profile_hash: { type: string }
        cached: { type: boolean, description: "true when nothing was reprocessed" }
        needs_review: { type: boolean }
        original:
          type: object
          nullable: true
          description: >
            Present only while an opt-in retained source image is live
            (instance setting originals.enabled AND the submit passed
            keep_original); null otherwise, including after expiry.
          properties:
            url: { type: string, description: "/v1/originals/{sha}; in signed mode it also carries exp and sig and needs no key" }
            expires_at: { type: string, description: "when the original is pruned" }
            url_expires_at: { type: string, description: "signed mode only: when this url stops working" }
            bytes: { type: integer }
            mime: { type: string }
        manual_regions:
          type: array
          description: "operator-drawn additive masks applied on top of the stored blob via the dashboard; always black, normalized 0..1 coords"
          items:
            type: object
            properties:
              shape: { type: string, enum: [rect, ellipse] }
              x: { type: number }
              y: { type: number }
              w: { type: number }
              h: { type: number }
        blob:
          type: object
          properties:
            url: { type: string }
            sha256: { type: string }
            bytes: { type: integer }
            mime: { type: string }
            key: { type: string, description: "object key in the blob store (relative path); empty once the bytes were pruned (TTL or eviction)" }
            location: { type: string, description: "where the bytes live: a local path, or s3://bucket/prefix/key" }
        image:
          type: object
          properties:
            width: { type: integer }
            height: { type: integer }
            mime: { type: string }
            source_kind: { type: string, enum: [url, file, stream] }
            source_ref: { type: string, nullable: true }
        codes: { type: array, items: { type: string }, description: "external ids bound to this source, within the caller's tenant" }
        codes_detail:
          type: array
          description: "unscoped callers only: which tenant owns each code"
          items:
            type: object
            properties:
              tenant: { type: string }
              external_id: { type: string }
        tags: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: { type: string } }
        detections:
          type: array
          items:
            type: object
            properties:
              cls: { type: string, enum: [face, plate] }
              box: { type: array, items: { type: integer }, minItems: 4, maxItems: 4 }
              score: { type: number }
              detector: { type: string }
        stats:
          type: object
          properties:
            timings:
              type: object
              description: "Per-stage milliseconds: fetch, decode, detect_face, detect_plate, redact, encode, store, total"
            detections: { type: object }
            models: { type: object }
            redact: { type: string }
            source:
              type: object
              description: "the source as received (its bytes are never stored)"
              properties:
                bytes: { type: integer }
                width: { type: integer }
                height: { type: integer }
                mime: { type: string }
                kind: { type: string, enum: [url, file, stream] }
            output:
              type: object
              description: "what was stored (absent on artifacts made before 0.23)"
              properties:
                bytes: { type: integer }
                optimized: { type: boolean, description: "true when output.optimize resized/recompressed the source" }
                width: { type: integer }
                height: { type: integer }
        created_at: { type: string }
        expires_at:
          type: string
          nullable: true
          description: "when the redacted bytes are (or were) pruned: the profile's storage.ttl counted from processing, or the moment rotation evicted them; null = kept until deleted or evicted"
        evicted_at:
          type: string
          nullable: true
          description: "set when storage rotation (storage.evict=oldest) deleted the bytes to stay under the cap; reads then answer 410 with details.reason=evicted. The record, codes and detections stay."
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
paths:
  /v1/health:
    get:
      security: []
      summary: Liveness. Unauthenticated.
      responses: { "200": { description: healthy } }
  /_health:
    get:
      security: []
      summary: "Daemon liveness (cli-daemon-spec). Answers {ok, service, pid}."
      responses: { "200": { description: healthy }, "503": { description: draining } }
  /_shutdown:
    post:
      security: []
      summary: "Stop the daemon (cli-daemon-spec). Loopback clients only."
      responses: { "200": { description: "{stopping:true} then the process exits" }, "401": { description: "non-loopback caller" } }
  /v1/feedback:
    post:
      security: []
      summary: Submit feedback (cli-feedback-spec). Open intake.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                id: { type: string, description: "client-generated idempotency key" }
                kind: { type: string, description: "bug | idea | praise | note" }
                message: { type: string }
                context: { type: string }
                reporter: { type: string }
                version: { type: string }
      responses:
        "200": { description: "{ok:true, id, stored:true}; a duplicate id is also a success" }
        "400": { description: "missing/empty message, or invalid JSON" }
        "413": { description: "body exceeds 16 KB" }
        "429": { description: "rate limited (30/min per IP)" }
    get:
      summary: Read feedback, newest first. Operator keys only.
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200": { description: "{ok:true, feedback:[...]}" }
        "401": { description: "Missing or invalid API key" }
        "403": { description: "Scoped key: reading feedback is operator-only" }
  /v1/images:
    post:
      summary: Submit an image for redaction (asynchronous)
      description: >
        Always creates a job and returns 202 immediately -- an HTTP request must
        not have to stay open while an image is fetched and processed. Pass
        ?wait=N to block for up to N seconds; if the job settles within that
        window the response is 200 with `result` filled in.
        If `external_id` is already known and on_conflict=reuse (the default),
        the job is returned already "done" without any fetch or decode.
      parameters:
        - { in: query, name: code, schema: { type: string }, description: "external_id; raw-body form. Often the filename." }
        - { in: query, name: wait, schema: { type: number }, description: "seconds to block, max 120. 0 = return at once." }
        - { in: query, name: on_conflict, schema: { type: string, enum: [reuse, replace, reject], default: reuse } }
        - { in: query, name: tags, schema: { type: string }, description: "comma separated (raw-body form)" }
        - { in: query, name: metadata, schema: { type: string }, description: "JSON object (raw-body form)" }
        - { in: query, name: keep_original, schema: { type: integer }, description: "seconds to retain the SOURCE image (60..originals.max_ttl, default cap 30 days). Opt-in; refused with 422 unless the instance enables originals. Also accepted as a JSON body field. Not part of profile_hash." }
        - in: query
          name: profile
          schema: { type: string }
          description: >
            JSON profile overrides, deep-merged into the defaults. A profile is
            the processing configuration — detect.{face,plate}.{model,min_score},
            detect.max_side, redact.{mode,modes,strength,expand,shape},
            output.{format,quality,max_side,optimize}, storage.ttl. redact.mode is one of
            pixelate|blur|solid; redact.modes is an optional per-class override
            {"face":m,"plate":m} taking precedence over mode for that class.
            Every mode the profile uses must be in the instance's
            allowed_redact_modes policy — asking for a disallowed mode fails
            the submit. The artifact cache key is
            (source_sha, profile_hash of the EFFECTIVE profile), so different
            intent is a different artifact. storage.ttl (seconds, 60–2592000)
            prunes the blob after the deadline: reads answer 410
            resource_expired while the record, detections and labels survive;
            a resubmit regenerates the bytes. Example for a 24h blob:
            {"storage":{"ttl":86400}}.
            output.optimize {above_bytes, max_side (256–16384, default 2560),
            quality (30–95, default 82)}: a source larger than above_bytes is
            downscaled to max_side and re-encoded at that quality before
            redaction; output is JPEG either way. Example:
            {"output":{"optimize":{"above_bytes":1500000}}}.
            SCOPE LIMITS: the operator may attach limits to a key's scope
            (max_input_bytes, optimize, ttl, max_keep_original). They are a
            floor, not a default: per field the strictest of request,
            instance default and scope limit applies, so a request can tighten
            (a lower above_bytes, a shorter ttl) but never loosen them, and the
            effective values are what profile_hash covers. keep_original is
            capped at max_keep_original.
        - { in: query, name: force, schema: { type: string }, description: "1 to bypass the cache" }
      requestBody:
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          application/octet-stream: { schema: { type: string, format: binary } }
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                external_id: { type: string }
                on_conflict: { type: string, enum: [reuse, replace, reject] }
                tags: { type: array, items: { type: string } }
                metadata: { type: object }
                profile: { type: object }
      responses:
        "202": { description: "Job accepted; Location header points at /v1/jobs/<id>", content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        "200": { description: "Job already settled (cache hit, or ?wait covered it)", content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        "401": { description: "Missing or invalid API key", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "422": { description: "validation_error: bad image, non-public URL, too large, a disallowed redact mode, or an image above this key's scope max_input_bytes (the message names the limit; details carry bytes, max_input_bytes, tenant)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "503": { description: "overloaded (code 108): the queue's byte budget is full, or the instance is draining; honour retry_after and retry (never 502)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "507": { description: "storage_full: the storage cap (storage.max_bytes) or the disk guard refuses new work. With rotation on (storage.evict=oldest) the cap evicts the oldest images instead, so 507 then means the disk guard or a bucket that is full even after eviction", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      summary: List stored artifacts
      parameters:
        - { in: query, name: tag, schema: { type: array, items: { type: string } }, description: "repeatable; ANDed" }
        - { in: query, name: "meta.<key>", schema: { type: string }, description: "exact metadata match" }
        - { in: query, name: sha, schema: { type: string }, description: "sha256 prefix" }
        - { in: query, name: code, schema: { type: string }, description: "external id; exact, or a trailing * for a prefix scan" }
        - { in: query, name: needs_review, schema: { type: string } }
        - { in: query, name: has_faces, schema: { type: string }, description: "1/0 -> only artifacts with/without detected faces" }
        - { in: query, name: has_plates, schema: { type: string }, description: "1/0 -> only artifacts with/without detected plates" }
        - { in: query, name: since, schema: { type: string } }
        - { in: query, name: until, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [created, faces, plates, size, review], default: created } }
        - { in: query, name: direction, schema: { type: string, enum: [desc, asc], default: desc } }
        - { in: query, name: cursor, schema: { type: string }, description: "next_cursor from the previous page; keyset pagination, O(1) at any depth" }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 }, description: "legacy; prefer cursor -- OFFSET is O(offset) and unstable under concurrent inserts" }
      responses:
        "200":
          description: >
            total, total_capped, count, items[], next_cursor, has_more, sort,
            direction. `total` stops counting at 10000 (total_capped=true) and
            is returned only when no cursor was supplied, because paging deeper
            cannot change it.
  /v1/images/{sha}:
    get:
      summary: Full record
      parameters:
        - { in: path, name: sha, required: true, schema: { type: string } }
        - { in: query, name: profile, schema: { type: string } }
      responses:
        "200": { description: "ok. Several artifacts may exist for one sha (one per profile); without ?profile the newest LIVE one is returned (an expired or evicted variant never shadows a live one), the same one /v1/blobs/{sha} serves", content: { application/json: { schema: { $ref: '#/components/schemas/Artifact' } } } }
        "404": { description: not found }
    delete:
      summary: Delete an image, its artifacts and its blobs
      parameters: [{ in: path, name: sha, required: true, schema: { type: string } }]
      responses: { "200": { description: deleted }, "404": { description: not found } }
  /v1/blobs/{sha}:
    get:
      summary: Redacted image bytes
      parameters:
        - { in: path, name: sha, required: true, schema: { type: string } }
        - { in: query, name: profile, schema: { type: string } }
      responses:
        "200": { description: "image/jpeg or image/png" }
        "404": { description: not found }
        "410": { description: "resource_expired: TTL'd or evicted blob was pruned (details.reason ttl|evicted); resubmit to regenerate", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/originals/{sha}:
    get:
      summary: Opt-in retained source image bytes
      description: >
        Readable by any key whose scope can read the redacted image, or with
        no key via a signed url (exp + sig) when originals.url_mode=signed.
        Sent with Cache-Control no-store.
      parameters:
        - { in: path, name: sha, required: true, schema: { type: string }, description: "full 64-hex source sha" }
        - { in: query, name: exp, schema: { type: integer }, description: "signed mode: unix expiry" }
        - { in: query, name: sig, schema: { type: string }, description: "signed mode: HMAC-SHA256 hex" }
      responses:
        "200": { description: "the original bytes, as submitted" }
        "401": { description: "missing key, or invalid/expired signature" }
        "404": { description: "never retained, out of scope, or the image was deleted" }
        "410": { description: "resource_expired: retention deadline passed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/images/{sha}/feedback:
    post:
      summary: Record quality feedback on an image
      description: >
        A human or agent reporting a missed, false-positive or badly placed
        redaction. Needs read access to the image (out of scope = 404). Stored
        under the key's tenant.
      parameters:
        - { in: path, name: sha, required: true, schema: { type: string }, description: "source sha or a unique prefix (6+ hex)" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [missed, false_positive, bad_box, ok, other] }
                comment: { type: string, maxLength: 4000 }
                box: { type: array, items: { type: integer }, description: "[x, y, w, h] in pixels of the redacted image" }
                profile_hash: { type: string, description: "which artifact it is about; defaults to the latest" }
      responses:
        "201": { description: "the stored feedback", content: { application/json: { schema: { $ref: '#/components/schemas/ImageFeedback' } } } }
        "404": { description: "unknown or out-of-scope image" }
    get:
      summary: Feedback on one image
      parameters:
        - { in: path, name: sha, required: true, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [open, resolved, all], default: all } }
      responses:
        "200": { description: "{items: ImageFeedback[], count, limit}" }
  /v1/image-feedback:
    get:
      summary: Recent feedback across images (the agent read)
      description: >
        Newest first, open only by default. An unrestricted key sees every
        tenant's feedback; a scoped key sees its own.
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, resolved, all], default: open } }
        - { in: query, name: kind, schema: { type: string, enum: [missed, false_positive, bad_box, ok, other] } }
        - { in: query, name: since, schema: { type: string }, description: "ISO-8601 UTC lower bound on created_at" }
        - { in: query, name: limit, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200": { description: "{items: ImageFeedback[], count, limit}" }
  /v1/image-feedback/{id}/resolve:
    post:
      summary: Mark feedback handled
      parameters:
        - { in: path, name: id, required: true, schema: { type: string }, description: "fb_ + 16 hex" }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { resolution: { type: string } } }
      responses:
        "200": { description: "the updated feedback", content: { application/json: { schema: { $ref: '#/components/schemas/ImageFeedback' } } } }
        "404": { description: "unknown, or another tenant's" }
  /v1/images/{sha}/reprocess:
    post:
      summary: Run a known image again with the current profile
      description: >
        Re-runs the pipeline with force=1. `source` says where the original
        bytes come from, with no fallback between sources: retained (the live
        opt-in original), source_url (the URL it was first submitted from,
        re-fetched), url (another URL, in the JSON body), upload (the image
        bytes as the body). Every source but retained must hash to the same
        sha (else 422). Labels and codes stay on the sha.
      parameters:
        - { in: path, name: sha, required: true, schema: { type: string } }
        - { in: query, name: source, required: true, schema: { type: string, enum: [retained, source_url, url, upload] }, description: "may also be given in the JSON body; defaults to upload for an image/* body" }
        - { in: query, name: wait, schema: { type: number, maximum: 120 } }
        - { in: query, name: keep_original, schema: { type: integer }, description: "also retain these bytes (not for source=retained); needs originals.enabled" }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { source: { type: string }, url: { type: string, description: "for source=url" }, profile: { type: object, description: "optional per-request profile overrides" } } }
          image/*:
            schema: { type: string, format: binary, description: "for source=upload" }
      responses:
        "200": { description: "finished job (adds reprocess_source)", content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        "202": { description: "job still running" }
        "404": { description: "unknown or out-of-scope image" }
        "409": { description: "the chosen source does not exist for this image (no retained original / not submitted by URL)" }
        "422": { description: "no or unknown source, or the bytes are a different image" }
        "504": { description: "the URL could not be fetched (upstream_error, code 105)" }
  /v1/thumbs/{sha}:
    get:
      summary: Thumbnail for grid views
      parameters: [{ in: path, name: sha, required: true, schema: { type: string } }]
      responses: { "200": { description: image/jpeg } }
  /v1/jobs:
    get:
      summary: List jobs
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [queued, running, done, failed] } }
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: sha, schema: { type: string }, description: "source_sha prefix" }
        - { in: query, name: tag, schema: { type: string }, description: "matches the job's submission-time tags snapshot" }
        - { in: query, name: since, schema: { type: string } }
        - { in: query, name: until, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [created, duration, status], default: created } }
        - { in: query, name: direction, schema: { type: string, enum: [desc, asc], default: desc } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: >
            total, total_capped, count, items[], next_cursor, has_more, queue{}.
            Items in a LISTING omit `result`; fetch a single job to get it.
  /v1/jobs/{job_id}:
    get:
      summary: Job status, and its result once done
      parameters:
        - { in: path, name: job_id, required: true, schema: { type: string } }
        - { in: query, name: wait, schema: { type: number }, description: "long-poll up to N seconds (max 120)" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        "404": { description: not found }
  /v1/images/by-code/{external_id}:
    get:
      summary: Full record, resolved by the producer's unique code
      parameters:
        - { in: path, name: external_id, required: true, schema: { type: string } }
        - { in: query, name: profile, schema: { type: string } }
        - { in: query, name: tenant, schema: { type: string }, description: "unscoped keys only: disambiguate a code used by several tenants" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Artifact' } } } }
        "404": { description: "no such external_id in this tenant" }
        "409": { description: "unscoped caller: the code is used by several tenants; details.tenants lists them" }
  /v1/blobs/by-code/{external_id}:
    get:
      summary: Redacted image bytes by unique code — the consumer hot path
      description: >
        One indexed lookup joined straight to the blob, bypassing JSON record
        assembly. Measured at ~13 us of query time with 50k images. Responds to
        If-None-Match with 304; the ETag is the redacted blob's sha256.
      parameters:
        - { in: path, name: external_id, required: true, schema: { type: string } }
        - { in: query, name: profile, schema: { type: string } }
      responses:
        "200": { description: "image bytes; ETag + Cache-Control set" }
        "304": { description: "If-None-Match matched" }
        "404": { description: "no such external_id" }
        "410": { description: "resource_expired: TTL'd or evicted blob was pruned (details.reason ttl|evicted); resubmit to regenerate", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/thumbs/by-code/{external_id}:
    get:
      summary: Thumbnail by unique code
      parameters: [{ in: path, name: external_id, required: true, schema: { type: string } }]
      responses: { "200": { description: image/jpeg } }
  # ---------------------------------------------------------------------------
  # /pub/* is UNAUTHENTICATED. An image is served only when an admin-declared
  # public rule (dashboard → public tab) matches its labels, evaluated at read
  # time so deleting the rule revokes on the next request. Sha-addressed only:
  # external codes are enumerable strings and must never be public handles.
  # Missing image, unmatched labels and revoked rules all return the same 404.
  # Public paths are rate-limited per IP (60/min) -- 429 is typed
  # `rate_limited`; authenticated paths have their own bucket (300/min).
  # ---------------------------------------------------------------------------
  /pub/blobs/{sha}:
    get:
      summary: Redacted image bytes, no key — only when a public rule matches
      security: []
      parameters:
        - { in: path, name: sha, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
        - { in: query, name: profile, schema: { type: string } }
      responses:
        "200": { description: "image bytes; ETag + Cache-Control set" }
        "404": { description: "no such image, or no public rule matches it" }
        "410": { description: "resource_expired: TTL'd blob was pruned" }
        "429": { description: "rate_limited: over 60/min from this address" }
  # ---------------------------------------------------------------------------
  # /ui-api/* is the DASHBOARD's surface. It is authenticated by dashboard basic
  # auth, NOT by an API key, and every mutation requires the CSRF token. It is
  # documented here so a port implements the same posture, but it is not part of
  # the machine-to-machine contract -- integrators use /v1.
  # ---------------------------------------------------------------------------
  /ui-api/keys:
    get:
      security: []
      summary: List API keys (dashboard auth; never returns a usable key)
      responses:
        "200": { description: "keys[], creation_enabled, note" }
        "401": { description: "dashboard auth required" }
    post:
      security: []
      summary: Mint an API key (optionally scoped)
      description: >
        Requires dashboard auth and the CSRF token. On by default since 0.23;
        BLURD_DASHBOARD_ALLOW_KEY_CREATION=false turns it off (409). When
        BLURD_DASHBOARD_KEY_SECRET is set, every mint also needs it as
        X-Blurd-Admin-Secret: a minted key outlives the dashboard password.
      parameters:
        - { in: header, name: X-Blurd-CSRF, required: true, schema: { type: string } }
        - { in: header, name: X-Blurd-Admin-Secret, required: false, schema: { type: string }, description: "only when a key secret is configured" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scope:
                  type: object
                  description: "omit for an unrestricted key; all constraints are ANDed"
                  properties:
                    tags: { type: array, items: { type: string } }
                    metadata: { type: object, additionalProperties: { type: string } }
      responses:
        "201": { description: "the plaintext key (returned exactly once), plus its scope and tenant" }
        "401": { description: "missing CSRF token or admin secret" }
        "409": { description: "creation is disabled; details.enable says how to turn it on" }
  /ui-api/keys/{key_id}:
    delete:
      security: []
      summary: Revoke a key (always available, immediate); with ?purge=1 remove a revoked one
      description: >
        Without purge: revoke. With purge=1: delete the row of an
        already-revoked key for good (audited); an active key is never
        removed, only revoked first (409).
      parameters:
        - { in: path, name: key_id, required: true, schema: { type: string } }
        - { in: query, name: purge, schema: { type: string }, description: "1 = remove a revoked key from the list" }
        - { in: header, name: X-Blurd-CSRF, required: true, schema: { type: string } }
      responses:
        "200": { description: "revoked, or removed" }
        "401": { description: "missing CSRF token" }
        "404": { description: "no such key, or already revoked" }
        "409": { description: "purge of a key that is still active" }
    patch:
      security: []
      summary: Rename a key (label only; secret and scope unchanged)
      parameters:
        - { in: path, name: key_id, required: true, schema: { type: string } }
        - { in: header, name: X-Blurd-CSRF, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "200": { description: "the key's listing row" }
        "404": { description: "no such key" }
  /ui-api/scope-policies:
    get:
      security: []
      summary: Scope limits, one row per scope (tenant) with its active keys
      responses: { "200": { description: "scopes[]: {tenant, description, keys[], policy}; tenant is global for unrestricted keys" } }
  /ui-api/scope-policies/{tenant}:
    put:
      security: []
      summary: Set a scope's limits (replaces them; all replicas within seconds)
      description: >
        Limits are a floor every request with a key of this scope must respect;
        see the profile parameter of POST /v1/images. Stored in the shared
        database, audited.
      parameters:
        - { in: path, name: tenant, required: true, schema: { type: string }, description: "global, or t_<16 hex> from the listing" }
        - { in: header, name: X-Blurd-CSRF, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                max_input_bytes: { type: integer, description: "1024..2^31; larger sources are refused with 422" }
                optimize: { type: object, description: "{above_bytes, max_side, quality}: forced optimization floor" }
                ttl: { type: integer, description: "seconds (60..2592000): default retention, a request can only shorten it" }
                max_keep_original: { type: integer, description: "seconds (60..2592000): ceiling for keep_original" }
                label: { type: string }
      responses:
        "200": { description: "the stored policy" }
        "422": { description: "unknown key or out-of-range value" }
    delete:
      security: []
      summary: Remove a scope's limits
      parameters:
        - { in: path, name: tenant, required: true, schema: { type: string } }
        - { in: header, name: X-Blurd-CSRF, required: true, schema: { type: string } }
      responses: { "200": { description: removed } }
  /ui-api/settings/runtime:
    get:
      security: []
      summary: Instance defaults the dashboard may change, with their source
      description: >
        settings: {dotted.path: {value, default, source: env|dashboard|default/file}},
        locked[] (paths an env var sets: read-only here), ttl_seconds (how
        long a replica may serve a stale value). Layering:
        defaults < config.json < these (shared database) < env.
      responses: { "200": { description: "settings, locked, ttl_seconds" } }
    post:
      security: []
      summary: Change instance defaults (only the paths sent; null = back to default)
      description: >
        Paths: profile.redact.mode, profile.redact.modes, allowed_redact_modes,
        profile.detect.{face,plate}.min_score, profile.detect.plate.min_aspect,
        profile.detect.plate.max_area, profile.output.optimize,
        profile.output.quality, profile.storage.ttl, fetch.max_bytes,
        storage.max_bytes, storage.evict (off|oldest), storage.evict_high_pct,
        storage.evict_low_pct, storage.orphan_check_hours. Validated per path;
        an env-locked path is refused. Audited; every replica applies it within
        ttl_seconds.
      parameters:
        - { in: header, name: X-Blurd-CSRF, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true, example: { "storage.max_bytes": 1000000000, "storage.evict": "oldest" } }
      responses:
        "200": { description: "the new state, same shape as GET" }
        "422": { description: "unknown path, invalid value, env-locked path, or evict_low_pct >= evict_high_pct" }
  /ui-api/storage/scan:
    get:
      security: []
      summary: Real store usage next to blurd's accounting
      description: >
        Lists the bucket (S3 ListObjectsV2) or walks the blob directory. On
        demand only: O(objects / 1000) requests.
      responses: { "200": { description: "backend, store_objects, store_bytes, accounted_bytes, drift_bytes, scan_ms" } }
  /ui-api/storage/orphans:
    get:
      security: []
      summary: Orphaned objects report (dry run)
      description: >
        Objects in the store that no record points at, by class:
        image_deleted, superseded, tombstoned, original_pruned, unparseable,
        probe. Objects younger than min_age_s (3600) count as `young`, never as
        orphans (a write stores the object before its row). A live call lists
        the store and saves the report; ?cached=1 returns the last saved one
        (also refreshed by the background check every
        storage.orphan_check_hours) without listing.
      parameters:
        - { in: query, name: cached, schema: { type: string }, description: "1 = last saved report, no listing (null when never checked)" }
      responses: { "200": { description: "backend, dry_run, min_age_s, total, referenced, orphans, young, missing_objects {count, sample}, classes {class: {objects, bytes, sample[], by_month}}, accounted_bytes, checked_at, checked_by, scan_ms" } }
    post:
      security: []
      summary: Delete orphans of the given classes (human-confirmed)
      description: >
        Re-classifies at delete time and removes only orphans of the listed
        classes older than min_age_s. Never automatic. Audited as
        storage.orphans_delete; a fresh report is saved afterwards and
        returned as `after`.
      parameters:
        - { in: header, name: X-Blurd-CSRF, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [classes, confirm]
              properties:
                classes: { type: array, items: { type: string, enum: [image_deleted, superseded, tombstoned, original_pruned, unparseable, probe] } }
                confirm: { type: boolean, description: "must be true" }
                min_age_s: { type: integer, default: 3600, minimum: 600 }
      responses:
        "200": { description: "the report plus deleted {objects, bytes, skipped_young, errors}, delete_classes, after" }
        "422": { description: "confirm is not true, or no/unknown classes" }
  /openapi.yaml:
    get:
      security: []
      summary: This document (dashboard auth), for download or code generation
      responses: { "200": { description: "application/yaml" } }
  /ui-api/audit:
    get:
      security: []
      summary: Recent privileged mutations
      parameters: [{ in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }]
      responses: { "200": { description: "at, actor, action, target, source_ip, detail" } }
  /v1/stats:
    get:
      summary: Aggregate counters
      responses: { "200": { description: "scope (unrestricted, or the key's scope), images, artifacts, detections, faces, plates, codes, needs_review, jobs {status: count}, queue {queued, running, done, failed, in_queue, workers, queue_max, queued_bytes, queue_max_bytes}, profile_hash (the instance default profile), home (operator key only), cached_for_seconds (counters are memoised ~3 s), bytes_stored, bytes_live, storage_max_bytes, storage_used_bytes (redacted + retained originals), storage_rotation {enabled, high_bytes, low_bytes}, disk {path,total_bytes,used_bytes,free_bytes,used_pct,max_pct} (operator key only), tags[]" } }
